# Banques suivies par Bank Insight.
# LEI = identifiant unique de l'entité juridique. Il sert de clé de jointure
# entre les données EBA et les rapports annuels.
# Les identifiants sont ceux de la liste officielle de l'EBA (TR_Metadata.xlsx),
# vérifiés avec : python -m src.ingestion.load_eba --check-banks
# Pour les groupes mutualistes sans LEI au niveau du groupe (Crédit Agricole, BPCE),
# l'EBA utilise un identifiant construit : code pays + début du LEI de l'organe central.
#
# report_pdf : nom du fichier à déposer dans data/raw/reports/
#   (Document d'enregistrement universel / rapport annuel, exercice 2024).

reference_date: "2024-12-31"

