name: bank_insight
version: "1.0.0"
config-version: 2
profile: bank_insight

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  bank_insight:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  bank_insight:
    +schema: ref
    eba_item_mapping:
      +column_types:
        kpi: varchar
        eba_item: varchar
        scale_to_percent: double
        comment: varchar
    kpi_definitions:
      +column_types:
        kpi: varchar
        label: varchar
        unit: varchar
        comparable_eba: boolean
